name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: syntax check scripts
        run: for f in js/*.js; do node --check "$f"; done
      - name: referenced files exist
        run: |
          for f in $(grep -oE '(src|href)="[^"]+"' index.html | cut -d'"' -f2 | grep -vE '^(https?:|#)'); do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
